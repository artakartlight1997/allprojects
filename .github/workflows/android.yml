name: Build Android APK

on:
  push:
    paths:
      - 'android-hello/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build debug APK
        working-directory: android-hello
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: cp android-hello/app/build/outputs/apk/debug/app-debug.apk hello-android.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-android-apk
          path: hello-android.apk

      # スマホから直接ダウンロードできるように、"dev" タグのプレリリースに
      # APK を添付する。
      #
      # リリースを削除してから作り直すと、その数秒間 URL が 404 になり、
      # 運悪くその瞬間にアクセスすると見えない。そのため
      # 「無ければ作る / あればアセットだけ差し替える」方式にしている。
      - name: Publish to dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view dev >/dev/null 2>&1; then
            gh release create dev \
              --title "Dev build" \
              --notes "初回作成" \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
          gh release upload dev hello-android.apk --clobber
          gh release edit dev \
            --title "Dev build ${GITHUB_SHA::7}" \
            --notes "ブランチ: ${GITHUB_REF_NAME} / コミット: ${GITHUB_SHA::7}"
