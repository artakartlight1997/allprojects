name: Build Android APK

on:
  push:
    paths:
      - 'android-hello/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build debug APK
        working-directory: android-hello
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: cp android-hello/app/build/outputs/apk/debug/app-debug.apk hello-android.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-android-apk
          path: hello-android.apk

      # スマホから直接ダウンロードできるように、"dev" タグのプレリリースを
      # 毎回作り直して APK を添付する。
      - name: Publish to dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev hello-android.apk \
            --title "Dev build ${GITHUB_SHA::7}" \
            --notes "ブランチ: ${GITHUB_REF_NAME} / コミット: ${GITHUB_SHA::7}" \
            --prerelease \
            --target "$GITHUB_SHA"
