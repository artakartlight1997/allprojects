name: Deploy download page

# 配布ページを GitHub Pages に置くためのワークフロー。
# APK の直リンクは長いので、短い URL から入れるようにする。
#   https://artakartlight1997.github.io/allprojects
#
# 【最初に一度だけ必要な設定】
#   リポジトリの Settings → Pages → Build and deployment →
#   Source を「GitHub Actions」にする。
#   Actions の自動トークンには Pages を新規作成する権限がないため、
#   この操作だけは手で行う必要がある。
#
# また Pages への配信は既定でデフォルトブランチからしか許可されないので、
# main への push でのみ動かす。
on:
  push:
    branches: [main]
    paths:
      # ★ ゲームを 1つずつ 書いて いたが、あたらしい ゲームを 足した ときに
      #   ここへ 書き足すのを わすれて「ページが 見つかりません」に なった。
      #   いまは どの ゲームフォルダでも きくように まとめて 書いて ある。
      - '*/site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages への配信は同時に 1 つだけ。実行中でもキャンセルはしない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # 公開するファイルを 1 つのフォルダにまとめる。
      #
      # ★ ここも ゲームを 1つずつ 書いて いたので、足しわすれると
      #   その ゲームだけ 404 に なった。いまは `*/site` を ぜんぶ 拾う。
      #   あたらしい ゲームを 作ったら、フォルダを 置くだけで 公開される。
      #
      #   ふりわけ:
      #     momo-adventure/site  →  /        （入口メニュー。/play/ に りなの大冒険）
      #     nihon-quest/site     →  /nihon/  （むかしからの URL を かえない）
      #     そのほか <name>/site →  /<name>/
      - name: Assemble site
        run: |
          set -e
          mkdir -p public
          cp -r momo-adventure/site/. public/
          mkdir -p public/nihon
          cp -r nihon-quest/site/. public/nihon/
          for d in */site; do
            g="${d%/site}"
            case "$g" in
              momo-adventure|nihon-quest) continue ;;
            esac
            mkdir -p "public/$g"
            cp -r "$d/." "public/$g/"
          done
          echo "--- 公開する ゲーム ---"
          ls -1 public | sort | tr '\n' ' '
          echo
          echo "ぜんぶで $(ls -1d public/*/ | wc -l) フォルダ"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
