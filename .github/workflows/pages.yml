name: Deploy download page

# 配布ページを GitHub Pages に置くためのワークフロー。
# APK の直リンクは長いので、短い URL から入れるようにする。
#   https://artakartlight1997.github.io/allprojects
#
# 【最初に一度だけ必要な設定】
#   リポジトリの Settings → Pages → Build and deployment →
#   Source を「GitHub Actions」にする。
#   Actions の自動トークンには Pages を新規作成する権限がないため、
#   この操作だけは手で行う必要がある。
#
# また Pages への配信は既定でデフォルトブランチからしか許可されないので、
# main への push でのみ動かす。
on:
  push:
    branches: [main]
    paths:
      - 'momo-adventure/site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages への配信は同時に 1 つだけ。実行中でもキャンセルはしない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: momo-adventure/site

      - id: deployment
        uses: actions/deploy-pages@v4
