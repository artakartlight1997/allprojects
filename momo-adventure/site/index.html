<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#241a33">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>りなのゲームランド</title>
<link rel="icon" href="play/icon.png">
<link rel="apple-touch-icon" href="play/icon.png">
<link rel="manifest" href="menu.webmanifest">
<style>
  :root {
    --bg: #1b1426; --card: #2a1f3a; --line: #3f2f56;
    --text: #f4ecf7; --muted: #b9a9c9; --pink: #ff8fbb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    padding: 20px 14px calc(28px + env(safe-area-inset-bottom));
    background: radial-gradient(130% 80% at 50% 0%, #43295c 0%, var(--bg) 62%);
    background-attachment: fixed;
    color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 22px; }
  h1 {
    font-size: clamp(1.6rem, 6vw, 2.5rem);
    margin: 0 0 6px; letter-spacing: .03em;
  }
  h1 .dot { color: var(--pink); }
  .sub { color: var(--muted); font-size: clamp(.85rem, 3vw, 1rem); margin: 0; }

  /* ゲームの ふだ。よこに ならぶ数は 画面のはばで かってに かわる。 */
  .games {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  }
  .game {
    display: flex; align-items: center; gap: 14px;
    text-decoration: none; color: inherit;
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 7px solid var(--accent, var(--pink));
    border-radius: 18px;
    padding: 12px 16px 12px 12px;
    box-shadow: 0 5px 0 rgba(0,0,0,.35);
    transition: transform .07s, box-shadow .07s;
    position: relative;
    min-height: 96px;
  }
  .game:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
  @media (hover: hover) {
    .game:hover { border-color: var(--accent, var(--pink)); }
  }
  .game img {
    width: 72px; height: 72px; flex: 0 0 72px;
    border-radius: 15px; display: block;
    background: #120e1a;
    image-rendering: auto;
  }
  /* name と desc は span なので、block に しないと 1 行に つながって
     「りなクラフト 3D のブロックの…」と 読みにくくなる */
  .game .txt { min-width: 0; display: block; }
  .game .name {
    display: block;
    font-weight: 700; font-size: 1.08rem; line-height: 1.35;
    margin: 0 0 3px;
  }
  .game .desc {
    display: block;
    color: var(--muted); font-size: .82rem; line-height: 1.45; margin: 0;
  }
  .game .go {
    margin-left: auto; flex: 0 0 auto;
    color: var(--accent, var(--pink)); font-size: 1.5rem; font-weight: 700;
    opacity: .8; padding-left: 4px;
  }
  .badge {
    position: absolute; top: -8px; right: 12px;
    background: #ffd166; color: #3a2a08;
    font-size: .68rem; font-weight: 700; letter-spacing: .06em;
    padding: 3px 9px; border-radius: 999px;
    box-shadow: 0 2px 0 rgba(0,0,0,.3);
  }

  .tip {
    margin: 22px 0 0; padding: 12px 16px;
    background: rgba(255,255,255,.05); border: 1px dashed var(--line);
    border-radius: 14px; color: var(--muted); font-size: .85rem; line-height: 1.7;
  }
  .tip b { color: var(--text); font-weight: 700; }

  details {
    margin-top: 16px; background: rgba(255,255,255,.04);
    border: 1px solid var(--line); border-radius: 14px; padding: 4px 16px;
  }
  summary {
    cursor: pointer; padding: 10px 0; font-size: .9rem; color: var(--muted);
  }
  details p, details ol { font-size: .86rem; color: var(--muted); line-height: 1.75; }
  details ol { padding-left: 1.25em; }
  .apk {
    display: inline-block; text-decoration: none;
    background: var(--pink); color: #3a2430; font-weight: 700;
    padding: 10px 18px; border-radius: 12px; font-size: .92rem;
    box-shadow: 0 4px 0 #d96e97; margin: 4px 0 12px;
  }
  .apk:active { transform: translateY(2px); box-shadow: 0 2px 0 #d96e97; }
  footer {
    text-align: center; color: var(--muted); font-size: .78rem; margin-top: 22px;
  }

  /* スマホを よこ向きに していると たてが みじかい。
     ゲームは よこ向きで あそぶので、こっちが よく使われる。
     見出しと ふだを 小さくして、一度に たくさん 見えるようにする。 */
  @media (max-height: 520px) {
    body { padding-top: 12px; }
    header { margin-bottom: 12px; }
    h1 { font-size: clamp(1.3rem, 5.5vh, 1.9rem); }
    .sub { font-size: .8rem; }
    .games { gap: 10px; }
    .game { min-height: 76px; padding: 8px 14px 8px 10px; border-radius: 15px; }
    .game img { width: 56px; height: 56px; flex-basis: 56px; border-radius: 12px; }
    .game .name { font-size: .97rem; }
    .game .desc { font-size: .76rem; line-height: 1.4; }
  }
  /* iPhone を よこ向きに したくらいの たかさ（375px）。
     ゲームが ふえて 4 だんに なったので、もう ひとまわり 小さくして
     ぜんぶが スクロールなしで 見えるようにする。 */
  @media (max-height: 430px) {
    body { padding-top: 8px; }
    header { margin-bottom: 8px; }
    /* ゲームが 21こに なった。3れつ（6だん）では もう 入らないので、
       よこ長の 画面では **4れつ**に して 4だんに おさめる。
       せつめいは 2行で 切る。行が のびると ふだが 高くなって はみ出すため。 */
    .games { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    /* 4れつに すると よこはばが せまい。せつめいを 出すと 名前が
       「りな…」で 切れて どの ゲームか わからなく なるので、
       せつめいを やめて **名前を 2行**に する。 */
    .game .desc { display: none; }
    .game .name {
      display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
      white-space: normal; line-height: 1.25;
    }
    h1 { font-size: clamp(1.1rem, 5vh, 1.5rem); margin-bottom: 2px; }
    /* ★ ゲームが 22こ。よこ向きの スマホでも スクロールなしで
       ぜんぶ 見えるように、あいさつの 1行は しまう。 */
    .sub { display: none; }
    .games { gap: 6px; }
    .game { min-height: 56px; padding: 6px 8px 6px 6px; border-radius: 13px; }
    /* 4れつだと よこが せまい。絵を 小さくして 名前の ばしょを かせぐ。 */
    .game img { width: 34px; height: 34px; flex-basis: 34px; border-radius: 8px; }
    .game .name { font-size: .9rem; margin-bottom: 1px; }
    .game .desc { font-size: .7rem; line-height: 1.32; }
    .badge { top: -6px; font-size: .6rem; padding: 2px 7px; }
  }
  /* iPhone SE を よこ向きに したくらい（375px）。もう ひとまわり 小さく。 */
  @media (max-height: 390px) {
    header { margin-bottom: 5px; }
    h1 { font-size: clamp(1rem, 4.6vh, 1.3rem); }
    .games { gap: 5px; }
    .game { min-height: 50px; padding: 5px 6px 5px 5px; border-radius: 11px; }
    .game img { width: 28px; height: 28px; flex-basis: 28px; border-radius: 7px; }
    .game .name { font-size: .78rem; line-height: 1.22; }
    .game .desc { font-size: .66rem; line-height: 1.28; }
  }
  a { color: var(--pink); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>りなのゲームランド</h1>
    <p class="sub">遊びたいゲームをえらんでね</p>
  </header>

  <!-- あたらしく 作ったものから 順に ならべている -->
  <!-- ★ ふだは JS が ならべる。ゲームの ならびは games.js に 書いて ある。
       index.html を ブラウザが おぼえて しまって、あたらしい ゲームが
       メニューに 出て こない ことが あった ので、ならびだけ 外に 出した。 -->
  <div class="games" id="games"></div>
<script src="games.js?v=2"></script>
<script>
  // games.js の ならびから ふだを 作る。見た目は 前と まったく おなじ。
  (function () {
    var box = document.getElementById('games');
    if (!box || typeof GAMES === 'undefined') return;
    var html = '';
    for (var i = 0; i < GAMES.length; i++) {
      var g = GAMES[i];
      html += '<a class="game" href="/allprojects/' + g.p + '/" style="--accent:' + g.c + '">' +
        (g.b ? '<span class="badge">' + g.b + '</span>' : '') +
        '<img src="' + g.i + '" alt="" width="72" height="72" loading="lazy">' +
        '<span class="txt"><span class="name">' + g.n + '</span>' +
        '<span class="desc">' + g.d + '</span></span>' +
        '<span class="go">\u203A</span></a>';
    }
    box.innerHTML = html;
  })();
</script>
<script src="/allprojects/stats.js?v=1"></script>
</body>
</html>
