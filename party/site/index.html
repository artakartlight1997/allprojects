<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#241838">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>みんなでパーティ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #241838;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100%; height: 100%; }
  /* 名前を 入れる ところ。ふだんは かくれていて、なまえを おした ときだけ
     その ばしょの 上に かさねて 出す。キャンバスに 字を 打つ しくみを
     じぶんで 作るより、ブラウザの input を つかう ほうが かくじつ。 */
  #nameIn {
    position: absolute; display: none; box-sizing: border-box;
    border: 3px solid #FFD166; border-radius: 8px;
    background: #2A1E4A; color: #fff; text-align: center;
    font-family: system-ui, sans-serif; font-weight: 700;
    padding: 0 4px; outline: none;
    touch-action: auto; -webkit-user-select: text; user-select: text;
  }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<input id="nameIn" maxlength="6" autocomplete="off" autocapitalize="off" spellcheck="false">
<!-- ?v= はキャッシュ避け。中身を直したら数字を 1 つ増やすこと。 -->
<script src="sound.js?v=2"></script>
<script src="chars.js?v=2"></script>
<script src="games.js?v=2"></script>
<script src="game.js?v=2"></script>
<script src="ui.js?v=3"></script>
<script src="/allprojects/gamebar.js?v=2"></script>
<script src="/allprojects/stats.js?v=1"></script>
</body>
</html>
